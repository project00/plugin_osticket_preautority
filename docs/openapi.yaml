openapi: 3.0.0
info:
  title: Contract Manager API
  description: API for managing customer contracts and interventions between PrestaShop and osTicket.
  version: 1.0.0
paths:
  /contracts:
    get:
      summary: Get active contracts for a customer and VIN
      parameters:
        - name: vin
          in: query
          required: true
          schema:
            type: string
            minLength: 17
            maxLength: 17
        - name: customer_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A list of contracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contract'
  /interventions/authorize:
    post:
      summary: Authorize a new intervention
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterventionRequest'
      responses:
        '200':
          description: Intervention authorized
        '400':
          description: Insufficient credit or invalid request
components:
  schemas:
    Contract:
      type: object
      properties:
        id:
          type: integer
        vin:
          type: string
        initial_value:
          type: number
        residual_value:
          type: number
        status:
          type: string
          enum: [ACTIVE, CONSUMED]
    InterventionRequest:
      type: object
      required: [contract_id, value, operator]
      properties:
        contract_id:
          type: integer
        value:
          type: number
        operator:
          type: string
        invoice_number:
          type: string
        description:
          type: string
